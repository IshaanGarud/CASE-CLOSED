# ==================================
# CASE CLOSED — LOCAL DEMO PROFILE
# Runs without external Supabase / PostgreSQL dependencies
# ==================================

spring.application.name=backend-local-demo

# Isolated H2 In-Memory Database for local execution
spring.datasource.url=jdbc:h2:mem:caseclosed_demo;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;INIT=CREATE SCHEMA IF NOT EXISTS private
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate creates isolated schema automatically for local demo
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable SQL init scripts
spring.sql.init.mode=never

server.port=8080
