<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="arthurBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1206" />
      <stop offset="50%" stop-color="#120b03" />
      <stop offset="100%" stop-color="#080401" />
    </linearGradient>

    <radialGradient id="arthurGlow" cx="40%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080401" stop-opacity="0" />
    </radialGradient>

    <filter id="portraitShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.9" />
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#arthurBg)" />
  <rect width="400" height="500" fill="url(#arthurGlow)" />
  <rect x="15" y="15" width="370" height="470" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4" />

  <!-- Character: Arthur Vance -->
  <g transform="translate(200, 155)" filter="url(#portraitShadow)">
    <!-- Rumpled Bespoke Tuxedo & Pinstripe Vest -->
    <path d="M -100,245 C -95,170 -70,130 -35,115 L 35,115 C 70,130 95,170 100,245 Z" fill="#18130e" stroke="#2c221a" stroke-width="2" />
    <!-- White Shirt with Open Top Button -->
    <polygon points="-20,110 -15,150 0,165 15,150 20,110 0,120" fill="#f1f5f9" />
    <!-- Loosened Dark Silk Bow Tie -->
    <path d="M -14,124 L -4,128 L -12,142 L -20,135 Z" fill="#450a0a" />
    <path d="M 14,124 L 4,128 L 12,142 L 20,135 Z" fill="#450a0a" />
    <circle cx="0" cy="128" r="3" fill="#7f1d1d" />

    <!-- Neck with Adam's Apple & Shadow -->
    <rect x="-18" y="70" width="36" height="45" fill="#decab2" />
    <path d="M -18,85 Q 0,105 18,85 Z" fill="#bfae98" />

    <!-- Face (Angular, intense, gambler with circles under eyes) -->
    <path d="M -32,25 C -34,65 -25,85 0,85 C 25,85 34,65 32,25 C 30,-15 15,-28 0,-28 C -15,-28 -30,-15 -32,25 Z" fill="#f0deca" />

    <!-- Five o'clock Stubble / Shadow -->
    <path d="M -26,45 C -26,75 -18,84 0,84 C 18,84 26,75 26,45 C 20,55 10,65 0,65 C -10,65 -20,55 -26,45 Z" fill="#a89582" opacity="0.35" />

    <!-- Dark Messy Hair under Hat -->
    <path d="M -33,10 C -34,-15 -20,-30 0,-30 C 20,-30 34,-15 33,10 C 25,-5 15,-15 0,-15 C -15,-15 -25,-5 -33,10 Z" fill="#1c140d" />

    <!-- Tilted Charcoal Fedora Hat -->
    <g transform="rotate(-6 0 0)">
      <ellipse cx="0" cy="-2" rx="46" ry="12" fill="#1e1812" stroke="#45382b" stroke-width="1.5" />
      <path d="M -30,-5 C -32,-35 -20,-48 0,-48 C 20,-48 32,-35 30,-5 Z" fill="#140f0a" stroke="#2d241b" stroke-width="1.5" />
      <!-- Silk Hatband with Gold Buckle -->
      <path d="M -30,-8 Q 0,-3 30,-8" stroke="#78350f" stroke-width="4" fill="none" />
      <rect x="-4" y="-12" width="8" height="8" fill="#d4af37" rx="1" />
    </g>

    <!-- Eyebrows (Tense, slightly furrowed) -->
    <path d="M -24,14 Q -14,10 -4,16" stroke="#271c14" stroke-width="2.2" fill="none" />
    <path d="M 4,14 Q 14,8 24,12" stroke="#271c14" stroke-width="2.2" fill="none" />

    <!-- Dark Circles under Eyes (Insomnia / Stress) -->
    <path d="M -20,28 Q -14,33 -8,28" stroke="#948372" stroke-width="1" fill="none" opacity="0.6" />
    <path d="M 8,28 Q 14,33 20,28" stroke="#948372" stroke-width="1" fill="none" opacity="0.6" />

    <!-- Eyes (Sharp, defensive glance) -->
    <ellipse cx="-14" cy="22" rx="5" ry="3" fill="#f8fafc" />
    <circle cx="-13" cy="22" r="2.8" fill="#1c1917" />
    <ellipse cx="14" cy="22" rx="5" ry="3" fill="#f8fafc" />
    <circle cx="15" cy="22" r="2.8" fill="#1c1917" />

    <!-- Nose -->
    <path d="M 0,18 L -3,42 L 5,42" stroke="#bfae98" stroke-width="1.8" fill="none" />

    <!-- Skeptical Smirking Mouth with Cigarette -->
    <path d="M -10,58 Q 0,56 12,60" stroke="#7f1d1d" stroke-width="1.8" fill="none" />
    <!-- White Cigarette in mouth corner -->
    <rect x="8" y="58" width="22" height="3.5" rx="1" fill="#f8fafc" transform="rotate(12 8 58)" />
    <circle cx="30" cy="62" r="2" fill="#ef4444" />
    <!-- Smoke Trail -->
    <path d="M 32,62 Q 40,45 35,30 Q 30,15 45,-5" stroke="#cbd5e1" stroke-width="1.2" fill="none" opacity="0.4" />

    <!-- Cut and Bandaged Right Hand resting in foreground -->
    <g transform="translate(45, 175)">
      <!-- Bandaged Palm / Fingers -->
      <rect x="-10" y="0" width="30" height="40" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1" />
      <line x1="-10" y1="12" x2="20" y2="12" stroke="#94a3b8" stroke-width="1.5" />
      <line x1="-10" y1="24" x2="20" y2="24" stroke="#94a3b8" stroke-width="1.5" />
      <!-- Blood Seep through Dressing -->
      <circle cx="5" cy="18" r="4" fill="#b91c1c" opacity="0.75" />
    </g>
  </g>

  <!-- Top Badge -->
  <rect x="140" y="8" width="120" height="18" fill="#d4af37" opacity="0.8" rx="2" />
  <text x="200" y="21" font-family="'Courier Prime', monospace" font-size="9" font-weight="bold" fill="#451a03" text-anchor="middle" letter-spacing="2">
    SUSPECT #03
  </text>

  <!-- Name Plate Bottom -->
  <g transform="translate(200, 435)">
    <rect x="-140" y="-18" width="280" height="42" rx="6" fill="#241407" stroke="#d97706" stroke-width="1.2" />
    <text x="0" y="-2" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#fef3c7" text-anchor="middle" letter-spacing="1">
      ARTHUR VANCE
    </text>
    <text x="0" y="14" font-family="'Courier Prime', monospace" font-size="10" fill="#fde68a" text-anchor="middle">
      ESTRANGED BROTHER • AGE 39
    </text>
  </g>
</svg>

