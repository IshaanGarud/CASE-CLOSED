<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vivienneBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#190626" />
      <stop offset="50%" stop-color="#110419" />
      <stop offset="100%" stop-color="#07020a" />
    </linearGradient>

    <radialGradient id="vivienneGlow" cx="60%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#07020a" stop-opacity="0" />
    </radialGradient>

    <filter id="portraitShadow">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#000" flood-opacity="0.9" />
    </filter>
  </defs>

  <rect width="400" height="500" fill="url(#vivienneBg)" />
  <rect width="400" height="500" fill="url(#vivienneGlow)" />
  <rect x="15" y="15" width="370" height="470" fill="none" stroke="#9333ea" stroke-width="1.5" opacity="0.4" />

  <!-- Character: Vivienne Fontaine -->
  <g transform="translate(200, 160)" filter="url(#portraitShadow)">
    <!-- Silk Gown & Fox Fur Stole -->
    <path d="M -95,240 C -90,170 -65,130 -30,120 L 30,120 C 65,130 90,170 95,240 Z" fill="#064e3b" stroke="#047857" stroke-width="2" />
    <!-- Fur Stole Wrapped on Shoulders -->
    <path d="M -105,170 C -70,140 -20,150 0,165 C 20,150 70,140 105,170 C 80,210 20,200 0,205 C -20,200 -80,210 -105,170 Z" fill="#2d1313" stroke="#451a1a" stroke-width="1.5" />

    <!-- Pearl Choker & Strands -->
    <g fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5">
      <circle cx="-16" cy="115" r="3" />
      <circle cx="-8" cy="117" r="3" />
      <circle cx="0" cy="118" r="3.5" />
      <circle cx="8" cy="117" r="3" />
      <circle cx="16" cy="115" r="3" />
      <!-- Long Pearl Loop Hanging Down -->
      <path d="M -12,120 Q 0,170 12,120" fill="none" stroke="#f1f5f9" stroke-width="2.5" stroke-dasharray="3 3" />
    </g>

    <!-- Slender Graceful Neck -->
    <rect x="-14" y="65" width="28" height="50" fill="#f5e6d3" />
    <path d="M -14,80 Q 0,100 14,80 Z" fill="#d8c2aa" />

    <!-- Face (Heart-shaped, 1920s jazz beauty) -->
    <path d="M -28,25 C -30,60 -20,80 0,80 C 20,80 30,60 28,25 C 26,-15 14,-28 0,-28 C -14,-28 -26,-15 -28,25 Z" fill="#fdf2e9" />

    <!-- Finger-Waved Raven Hair -->
    <path d="M -30,20 C -34,-10 -25,-35 0,-35 C 25,-35 34,-10 30,20 C 25,5 20,-10 0,-10 C -20,-10 -25,5 -30,20 Z" fill="#09050d" />
    <!-- Sculpted side-waves -->
    <path d="M -32,15 Q -38,30 -30,45 Q -24,35 -30,20 Z" fill="#09050d" />
    <path d="M 32,15 Q 38,30 30,45 Q 24,35 30,20 Z" fill="#09050d" />

    <!-- 1920s Jeweled Flapper Headband -->
    <path d="M -30,2 Q 0,-6 30,2" stroke="#d4af37" stroke-width="3" fill="none" />
    <!-- Emerald Forehead Brooch -->
    <circle cx="0" cy="-2" r="5" fill="#10b981" stroke="#fef08a" stroke-width="1.2" />
    <!-- Black Ostrich Feather plume rising up -->
    <path d="M -1,-5 Q -10,-45 -22,-65 Q -8,-45 2,-5 Z" fill="#180c22" stroke="#6b21a8" stroke-width="1" />

    <!-- High Arched 1920s Eyebrows -->
    <path d="M -22,12 Q -14,6 -6,14" stroke="#09050d" stroke-width="1.5" fill="none" />
    <path d="M 6,14 Q 14,6 22,12" stroke="#09050d" stroke-width="1.5" fill="none" />

    <!-- Smoky Kohl Eyes (Smoldering cabaret gaze) -->
    <ellipse cx="-13" cy="22" rx="7" ry="4" fill="#1e1022" />
    <circle cx="-13" cy="22" r="3" fill="#09050d" />
    <circle cx="-14" cy="20.5" r="1" fill="#fff" />

    <ellipse cx="13" cy="22" rx="7" ry="4" fill="#1e1022" />
    <circle cx="13" cy="22" r="3" fill="#09050d" />
    <circle cx="12" cy="20.5" r="1" fill="#fff" />

    <!-- Delicate Nose -->
    <path d="M 0,20 L -2,40 L 3,40" stroke="#d8c2aa" stroke-width="1.2" fill="none" />

    <!-- Deep Ruby Cupid's Bow Lips -->
    <path d="M -8,55 Q -4,51 0,53 Q 4,51 8,55 Q 0,63 -8,55 Z" fill="#991b1b" stroke="#7f1d1d" stroke-width="0.8" />
    <!-- Beauty Mark on Left Cheek -->
    <circle cx="-14" cy="46" r="1.2" fill="#09050d" />

    <!-- Left Pearl Earring (The one she kept; other dropped in study) -->
    <circle cx="28" cy="38" r="3.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" />
    <path d="M 28,41 L 28,49 Q 28,52 26,52" stroke="#d4af37" stroke-width="1" fill="none" />
    <ellipse cx="26" cy="54" rx="2.5" ry="4" fill="#f8fafc" />
  </g>

  <!-- Top Badge -->
  <rect x="140" y="8" width="120" height="18" fill="#d4af37" opacity="0.8" rx="2" />
  <text x="200" y="21" font-family="'Courier Prime', monospace" font-size="9" font-weight="bold" fill="#3b0764" text-anchor="middle" letter-spacing="2">
    SUSPECT #02
  </text>

  <!-- Name Plate Bottom -->
  <g transform="translate(200, 435)">
    <rect x="-140" y="-18" width="280" height="42" rx="6" fill="#1e092b" stroke="#a855f7" stroke-width="1.2" />
    <text x="0" y="-2" font-family="'Cinzel', serif" font-size="15" font-weight="bold" fill="#fae8ff" text-anchor="middle" letter-spacing="1">
      VIVIENNE FONTAINE
    </text>
    <text x="0" y="14" font-family="'Courier Prime', monospace" font-size="10" fill="#d8b4fe" text-anchor="middle">
      CABARET CHANTEUSE • AGE 26
    </text>
  </g>
</svg>

