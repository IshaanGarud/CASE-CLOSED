<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgSteam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a101d" />
      <stop offset="50%" stop-color="#141c2b" />
      <stop offset="100%" stop-color="#05070a" />
    </linearGradient>
    <linearGradient id="silverPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <rect width="600" height="800" fill="url(#bgSteam)" />
  <rect x="25" y="25" width="550" height="750" fill="none" stroke="#64748b" stroke-width="1.5" opacity="0.4" />
  <rect x="35" y="35" width="530" height="730" fill="none" stroke="#64748b" stroke-width="1" opacity="0.2" />

  <!-- Badge Header -->
  <g transform="translate(300, 75)">
    <rect x="-85" y="-14" width="170" height="28" rx="6" fill="#131c2e" stroke="#38bdf8" stroke-width="1" />
    <text x="0" y="5" font-family="'Courier Prime', monospace" font-size="11" fill="#7dd3fc" font-weight="bold" letter-spacing="3" text-anchor="middle">CASE FILE #CC-002</text>
  </g>

  <!-- Locomotive in Snowstorm Silhouette -->
  <g transform="translate(300, 310)">
    <!-- Mountain Bluffs -->
    <path d="M -220,100 L -110,-40 L 0,30 L 120,-60 L 220,100 Z" fill="#0c1322" />
    <!-- Steam Engine Head -->
    <path d="M -90,120 L -90,0 Q 0,-30 90,0 L 90,120 Z" fill="#070a10" stroke="#334155" stroke-width="2" />
    <!-- Glowing Headlight Beam -->
    <circle cx="0" cy="15" r="28" fill="#fef08a" opacity="0.9" />
    <polygon points="0,15 -180,240 180,240" fill="#fef08a" opacity="0.08" />
    <!-- Cowcatcher Grill -->
    <path d="M -70,120 L 0,85 L 70,120 Z" fill="#1e293b" stroke="#475569" stroke-width="1" />
  </g>

  <text x="300" y="530" font-family="'Cinzel', serif" font-size="34" font-weight="900" fill="url(#silverPlate)" letter-spacing="3" text-anchor="middle">
    MURDER ON THE
  </text>
  <text x="300" y="575" font-family="'Cinzel', serif" font-size="36" font-weight="900" fill="url(#silverPlate)" letter-spacing="3" text-anchor="middle">
    ALPS EXPRESS
  </text>
  <text x="300" y="610" font-family="'Playfair Display', serif" font-size="16" font-style="italic" fill="#94a3b8" letter-spacing="1" text-anchor="middle">
    The St. Moritz Snowbound Mystery • Coming Soon
  </text>

  <g transform="translate(300, 660)">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#0f172a" stroke="#1e293b" />
    <text x="0" y="5" font-family="'Courier Prime', monospace" font-size="11" fill="#64748b" text-anchor="middle">EXPANSION PACK • WINTER 1928</text>
  </g>

  <g transform="translate(300, 715)">
    <rect x="-70" y="-12" width="140" height="24" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <text x="0" y="4" font-family="'Courier Prime', monospace" font-size="10" font-weight="bold" fill="#94a3b8" letter-spacing="2" text-anchor="middle">CLASSIFIED</text>
  </g>
</svg>

