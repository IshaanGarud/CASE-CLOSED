<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="mudBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14110b" />
      <stop offset="100%" stop-color="#070503" />
    </linearGradient>
  </defs>

  <rect width="400" height="300" fill="url(#mudBg)" />

  <!-- Broken Conservatory Window Glass Shards in Background -->
  <polygon points="40,40 180,20 130,110 30,80" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.3" />
  <polygon points="260,30 350,60 310,130 240,90" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.25" />

  <!-- Forensic Plaster Cast / Mud Impression of Size 10 Wingtip Shoe -->
  <g transform="translate(150, 140) rotate(-10)">
    <!-- Sole Impression Outline -->
    <path d="M -35,-80 C -45,-40 -40,10 -25,40 L -25,80 C -20,95 20,95 25,80 L 25,40 C 40,10 45,-40 35,-80 C 20,-100 -20,-100 -35,-80 Z" fill="#292524" stroke="#57534e" stroke-width="2" />
    
    <!-- British Brogue Wingtip Perforations Pattern -->
    <!-- Toe Medallion Perforations -->
    <path d="M -22,-65 Q 0,-85 22,-65" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="2 3" />
    <path d="M -28,-50 Q 0,-70 28,-50" fill="none" stroke="#78716c" stroke-width="2" stroke-dasharray="2 3" />
    <circle cx="0" cy="-70" r="2.5" fill="#a8a29e" />
    <circle cx="-8" cy="-60" r="2" fill="#a8a29e" />
    <circle cx="8" cy="-60" r="2" fill="#a8a29e" />
    
    <!-- Heel Tread Section -->
    <line x1="-22" y1="45" x2="22" y2="45" stroke="#78716c" stroke-width="2" />
    <circle cx="0" cy="65" r="4" fill="#1c1917" />
    <rect x="-18" y="55" width="36" height="2" fill="#78716c" />
    <rect x="-18" y="72" width="36" height="2" fill="#78716c" />

    <!-- Scale Ruler Mark -->
    <text x="-55" y="0" font-family="'Courier Prime', monospace" font-size="8" fill="#a8a29e" transform="rotate(-90 -55 0)">SIZE 10 (UK)</text>
  </g>

  <!-- Bloodstained Monogrammed Gold Cufflink ('A.V.') -->
  <g transform="translate(290, 140)">
    <!-- Blood Splatter Droplet -->
    <ellipse cx="2" cy="18" rx="16" ry="6" fill="#7f1d1d" opacity="0.8" />
    <!-- Gold Oval Cufflink -->
    <ellipse cx="0" cy="0" rx="26" ry="18" fill="#d4af37" stroke="#fef08a" stroke-width="1.8" />
    <ellipse cx="0" cy="0" rx="22" ry="14" fill="#b45309" stroke="#78350f" stroke-width="1" />
    <!-- Monogram Engraving 'A.V.' -->
    <text x="0" y="5" font-family="'Cinzel', serif" font-size="12" font-weight="bold" fill="#fef08a" text-anchor="middle" letter-spacing="1">A.V.</text>
    <!-- Blood Smear across Gold Corner -->
    <path d="M 12,-10 Q 22,2 18,12 Q 10,8 12,-10 Z" fill="#991b1b" />
  </g>

  <!-- Specimen Label -->
  <rect x="20" y="255" width="360" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="35" y="273" font-family="'Courier Prime', monospace" font-size="11" fill="#f59e0b">
    FORENSIC: Size 10 Wingtip Tread &amp; Arthur Vance's Bloodstained Cufflink
  </text>
</svg>

