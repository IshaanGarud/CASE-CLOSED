<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="photoBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140a08" />
      <stop offset="100%" stop-color="#070302" />
    </linearGradient>
    <radialGradient id="whisky" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#photoBg)" />
  <!-- Forensic Ruler in Top Corner -->
  <rect x="20" y="20" width="120" height="15" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
  <g stroke="#0f172a" stroke-width="1">
    <line x1="30" y1="20" x2="30" y2="28" />
    <line x1="40" y1="20" x2="40" y2="35" />
    <line x1="50" y1="20" x2="50" y2="28" />
    <line x1="60" y1="20" x2="60" y2="35" />
    <line x1="70" y1="20" x2="70" y2="28" />
    <line x1="80" y1="20" x2="80" y2="35" />
    <line x1="90" y1="20" x2="90" y2="28" />
    <line x1="100" y1="20" x2="100" y2="35" />
    <line x1="110" y1="20" x2="110" y2="28" />
    <line x1="120" y1="20" x2="120" y2="35" />
    <line x1="130" y1="20" x2="130" y2="28" />
  </g>
  <text x="145" y="32" font-family="'Courier Prime', monospace" font-size="10" fill="#94a3b8">EXHIBIT A</text>

  <!-- Heavy Crystal Tumbler -->
  <g transform="translate(200, 150)">
    <!-- Glass Body Facets -->
    <path d="M -55,-70 L -45,65 Q 0,78 45,65 L 55,-70 Z" fill="#1e293b" opacity="0.8" stroke="#94a3b8" stroke-width="2" />
    <!-- Cut-Glass Diamond Facet Patterns -->
    <path d="M -45,65 L -20,20 L 0,68 L 20,20 L 45,65" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M -20,20 L 0,-25 L 20,20" fill="none" stroke="#cbd5e1" stroke-width="1.5" />
    <path d="M -40,-20 L -20,20 L -50,20" fill="none" stroke="#94a3b8" stroke-width="1" />
    <path d="M 40,-20 L 20,20 L 50,20" fill="none" stroke="#94a3b8" stroke-width="1" />

    <!-- Scotch Dregs with Cyanide Precipitate -->
    <path d="M -47,15 L -45,65 Q 0,78 45,65 L 47,15 Q 0,25 -47,15 Z" fill="url(#whisky)" opacity="0.95" />
    <!-- White Cyanide Crystal Flecks in Dregs -->
    <circle cx="-15" cy="50" r="1.5" fill="#ffffff" />
    <circle cx="-5" cy="58" r="2" fill="#ffffff" />
    <circle cx="12" cy="52" r="1.8" fill="#ffffff" />
    <circle cx="22" cy="45" r="1.2" fill="#ffffff" />

    <!-- Cyanide Warning Stamp -->
    <g transform="translate(60, 40) rotate(-15)">
      <rect x="-35" y="-12" width="70" height="24" rx="3" fill="#7f1d1d" stroke="#ef4444" stroke-width="1" />
      <text x="0" y="4" font-family="'Courier Prime', monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">CYANIDE +</text>
    </g>
  </g>

  <!-- Specimen Label -->
  <rect x="20" y="255" width="360" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="35" y="273" font-family="'Courier Prime', monospace" font-size="11" fill="#f59e0b">
    FORENSIC: Glenfarclas Scotch laced with Potassium Cyanide
  </text>
</svg>

