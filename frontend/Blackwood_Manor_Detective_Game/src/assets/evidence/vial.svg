<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="vialBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140b08" />
      <stop offset="100%" stop-color="#060302" />
    </linearGradient>
    <radialGradient id="amberGlass" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#d97706" />
      <stop offset="85%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#vialBg)" />

  <!-- Burned Hearth Ash & Embers Background -->
  <ellipse cx="200" cy="180" rx="140" ry="50" fill="#1c1917" stroke="#44403c" stroke-width="1" />
  <circle cx="140" cy="190" r="3" fill="#ea580c" opacity="0.6" />
  <circle cx="260" cy="175" r="4" fill="#ea580c" opacity="0.5" />

  <!-- Crushed Amber Apothecary Vial Exhibit -->
  <g transform="translate(190, 130) rotate(-25)">
    <!-- Amber Bottle Neck & Lip -->
    <rect x="-18" y="-70" width="36" height="15" rx="3" fill="url(#amberGlass)" stroke="#fef08a" stroke-width="1" />
    <rect x="-14" y="-55" width="28" height="20" fill="url(#amberGlass)" />
    <!-- Cork Stopper Remains -->
    <rect x="-10" y="-80" width="20" height="12" rx="2" fill="#78350f" stroke="#451a03" stroke-width="1" />

    <!-- Glass Body (Cracked base from fire tongs) -->
    <path d="M -35,-35 L -35,45 Q 0,55 35,45 L 35,-35 Z" fill="url(#amberGlass)" stroke="#fef08a" stroke-width="1.5" />
    <!-- Shatter Fracture lines -->
    <path d="M 10,20 L 35,45 M 10,20 L -15,48 M 10,20 L 5,-10" stroke="#fef9c3" stroke-width="1.5" />

    <!-- Prescription Label Fragment -->
    <rect x="-28" y="-20" width="56" height="42" rx="2" fill="#fef3c7" stroke="#b45309" stroke-width="0.8" opacity="0.9" />
    <text x="0" y="-8" font-family="'Courier Prime', monospace" font-size="6.5" font-weight="bold" fill="#78350f" text-anchor="middle">ST. JUDE HOSPITAL</text>
    <text x="0" y="2" font-family="'Courier Prime', monospace" font-size="6" fill="#991b1b" text-anchor="middle">DR. R. THORNE</text>
    <text x="0" y="12" font-family="'Courier Prime', monospace" font-size="6" font-weight="bold" fill="#0f172a" text-anchor="middle">DEPOT: TR-8</text>

    <!-- White Cyanide Powder Traces Inside Neck -->
    <path d="M -10,-45 Q 0,-40 10,-45 Q 0,-48 -10,-45 Z" fill="#ffffff" />
  </g>

  <!-- Evidence Tag Connected with String -->
  <g transform="translate(290, 80)">
    <polygon points="0,0 20,-10 65,-10 65,30 20,30 0,20" fill="#fef3c7" stroke="#b45309" stroke-width="1" />
    <circle cx="10" cy="10" r="3" fill="#1c1917" />
    <text x="40" y="8" font-family="'Courier Prime', monospace" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle">SMOKING</text>
    <text x="40" y="18" font-family="'Courier Prime', monospace" font-size="7" font-weight="bold" fill="#7f1d1d" text-anchor="middle">GUN</text>
    <!-- Red Evidence String -->
    <path d="M 0,10 Q -50,30 -75,60" stroke="#ef4444" stroke-width="1.5" fill="none" />
  </g>

  <!-- Specimen Label -->
  <rect x="20" y="255" width="360" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="35" y="273" font-family="'Courier Prime', monospace" font-size="11" fill="#f59e0b">
    PHYSICAL: St. Jude Hospital Amber Vial with Cyanide &amp; Code TR-8
  </text>
</svg>

