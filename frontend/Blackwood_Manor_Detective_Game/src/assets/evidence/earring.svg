<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%">
  <defs>
    <linearGradient id="earringBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140816" />
      <stop offset="100%" stop-color="#07020a" />
    </linearGradient>
    <radialGradient id="pearlGlow" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#94a3b8" />
    </radialGradient>
  </defs>

  <rect width="400" height="300" fill="url(#earringBg)" />

  <!-- Persian Rug Texture (Fringes in corner where found) -->
  <g stroke="#991b1b" stroke-width="1.5" opacity="0.4">
    <line x1="20" y1="230" x2="160" y2="230" />
    <line x1="20" y1="235" x2="160" y2="235" />
    <line x1="20" y1="240" x2="160" y2="240" />
    <!-- Gold Embroidered Rug Leaf Pattern -->
    <path d="M 60,210 Q 80,180 100,210 Q 80,240 60,210" fill="none" stroke="#d4af37" stroke-width="1.5" />
  </g>

  <!-- Large South Sea Pearl Teardrop Earring -->
  <g transform="translate(200, 125)">
    <!-- Gold Earring Hook -->
    <path d="M 0,-70 C -15,-70 -25,-55 -25,-40 C -25,-30 -15,-20 0,-15" fill="none" stroke="#d4af37" stroke-width="2.5" />
    <!-- Diamond/Emerald Stud Mount -->
    <polygon points="0,-15 10,-8 0,-1 -10,-8" fill="#10b981" stroke="#fef08a" stroke-width="1.2" />
    <!-- Connector Gold Cap -->
    <path d="M -14,6 Q 0,-2 14,6 L 10,18 Q 0,14 -10,18 Z" fill="#d4af37" stroke="#ca8a04" stroke-width="1" />

    <!-- Iridescent Pearl Teardrop Body -->
    <path d="M 0,12 C 22,25 36,55 32,85 C 28,110 -28,110 -32,85 C -36,55 -22,25 0,12 Z" fill="url(#pearlGlow)" stroke="#f1f5f9" stroke-width="1" />
    <!-- Lustrous Highlights -->
    <ellipse cx="-10" cy="55" rx="6" ry="12" fill="#ffffff" opacity="0.8" transform="rotate(-20 -10 55)" />
    <circle cx="12" cy="85" r="4" fill="#ffffff" opacity="0.4" />
  </g>

  <!-- Magnifying Reticle Circle Overlay -->
  <g transform="translate(200, 175)">
    <circle cx="0" cy="0" r="85" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.6" />
    <line x1="-95" y1="0" x2="-85" y2="0" stroke="#a855f7" stroke-width="2" />
    <line x1="85" y1="0" x2="95" y2="0" stroke="#a855f7" stroke-width="2" />
    <line x1="0" y1="-95" x2="0" y2="-85" stroke="#a855f7" stroke-width="2" />
    <line x1="0" y1="85" x2="0" y2="95" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Specimen Label -->
  <rect x="20" y="255" width="360" height="28" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />
  <text x="35" y="273" font-family="'Courier Prime', monospace" font-size="11" fill="#c084fc">
    PHYSICAL: South Sea Pearl Teardrop matching Vivienne Fontaine
  </text>
</svg>

