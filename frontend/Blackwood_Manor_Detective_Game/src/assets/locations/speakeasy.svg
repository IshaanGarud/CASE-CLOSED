<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="speakeasyBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#120517" />
      <stop offset="50%" stop-color="#1f0927" />
      <stop offset="100%" stop-color="#0a030d" />
    </linearGradient>

    <radialGradient id="spotlight" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#e879f9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#120517" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="barGlow" cx="80%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#b45309" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#120517" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Vault -->
  <rect width="800" height="500" fill="url(#speakeasyBg)" />

  <!-- Stone Brick Cellar Arches -->
  <path d="M 0,220 Q 200,60 400,220 Q 600,60 800,220 L 800,500 L 0,500 Z" fill="#14061a" stroke="#2a0d36" stroke-width="3" />
  <path d="M 50,220 Q 200,100 350,220" fill="none" stroke="#3b0764" stroke-width="2" />
  <path d="M 450,220 Q 600,100 750,220" fill="none" stroke="#3b0764" stroke-width="2" />

  <!-- Velvet Stage Curtains -->
  <path d="M 0,0 Q 60,180 30,360 L 0,360 Z" fill="#581c87" opacity="0.8" />
  <path d="M 420,0 Q 480,180 450,360 L 420,360 Z" fill="#3b0764" opacity="0.8" />

  <!-- Jazz Spotlight on Stage -->
  <ellipse cx="230" cy="380" rx="140" ry="40" fill="url(#spotlight)" />

  <!-- Baby Grand Piano Silhouette on Stage -->
  <g transform="translate(140, 220)">
    <!-- Stage Platform -->
    <polygon points="-40,160 220,160 200,200 -60,200" fill="#1a0a24" stroke="#4a154b" stroke-width="1.5" />
    <!-- Piano Body & Open Lid -->
    <path d="M 20,120 L 20,40 Q 60,30 110,50 Q 140,70 150,120 Z" fill="#08020a" stroke="#2e0832" stroke-width="2" />
    <!-- Prop Stick & Lid Angle -->
    <polygon points="20,40 100,-25 150,50 110,50" fill="#0c0410" stroke="#4a154b" stroke-width="1.5" />
    <line x1="85" y1="20" x2="100" y2="-20" stroke="#d4af37" stroke-width="2" />
    <!-- Keyboard Keys -->
    <rect x="25" y="112" width="70" height="8" fill="#f8fafc" />
    <line x1="35" y1="112" x2="35" y2="120" stroke="#0f172a" stroke-width="1.5" />
    <line x1="45" y1="112" x2="45" y2="120" stroke="#0f172a" stroke-width="1.5" />
    <line x1="55" y1="112" x2="55" y2="120" stroke="#0f172a" stroke-width="1.5" />
    <line x1="65" y1="112" x2="65" y2="120" stroke="#0f172a" stroke-width="1.5" />
    <line x1="75" y1="112" x2="75" y2="120" stroke="#0f172a" stroke-width="1.5" />
    <line x1="85" y1="112" x2="85" y2="120" stroke="#0f172a" stroke-width="1.5" />
    <!-- Piano Legs -->
    <line x1="25" y1="120" x2="25" y2="160" stroke="#08020a" stroke-width="4" />
    <line x1="145" y1="120" x2="145" y2="160" stroke="#08020a" stroke-width="4" />

    <!-- Vintage Ribbon Microphone Stand -->
    <g transform="translate(190, 30)">
      <line x1="0" y1="130" x2="0" y2="30" stroke="#d4af37" stroke-width="2" />
      <circle cx="0" cy="130" r="12" fill="#2d1313" />
      <!-- Round Spring Microphone Head -->
      <circle cx="0" cy="20" r="10" fill="#1e1b4b" stroke="#d4af37" stroke-width="1.5" />
      <rect x="-4" y="14" width="8" height="12" fill="#d4af37" />
    </g>
  </g>

  <!-- Wet Bar & Liquor Bottles (Right Section) -->
  <g transform="translate(520, 160)">
    <rect width="250" height="340" fill="url(#barGlow)" />
    <!-- Back Bar Shelves -->
    <rect x="0" y="40" width="240" height="6" fill="#78350f" />
    <rect x="0" y="110" width="240" height="6" fill="#78350f" />
    <rect x="0" y="180" width="240" height="6" fill="#78350f" />

    <!-- Vintage Bottles & Decanters -->
    <g fill="#d97706" opacity="0.85">
      <!-- Whiskey Bottle -->
      <rect x="15" y="60" width="14" height="48" rx="2" fill="#b45309" />
      <rect x="18" y="48" width="8" height="14" rx="1" fill="#78350f" />
      <!-- Gin Bottle Green -->
      <rect x="40" y="55" width="18" height="53" rx="3" fill="#047857" />
      <!-- Wine Bottle -->
      <rect x="70" y="50" width="16" height="58" rx="2" fill="#991b1b" />
      <!-- Champagne Flutes -->
      <polygon points="120,95 110,65 130,65" fill="#fef08a" opacity="0.6" />
      <line x1="120" y1="95" x2="120" y2="108" stroke="#fef08a" stroke-width="1.5" />
    </g>

    <!-- Lower Shelf Bottles -->
    <g fill="#b45309" opacity="0.8">
      <rect x="25" y="130" width="22" height="48" rx="4" fill="#d97706" />
      <rect x="60" y="125" width="16" height="53" rx="2" fill="#1e3a8a" />
      <rect x="90" y="135" width="20" height="43" rx="3" fill="#065f46" />
      <!-- The Glenfarclas 1898 decanter -->
      <rect x="130" y="120" width="24" height="58" rx="5" fill="#f59e0b" stroke="#d4af37" stroke-width="1" />
      <circle cx="142" cy="115" r="5" fill="#d4af37" />
    </g>

    <!-- Polished Mahogany Bar Counter Surface -->
    <polygon points="-40,240 260,240 240,320 -60,320" fill="#291207" stroke="#451a03" stroke-width="2" />
    <!-- Bar Stool Silhouette -->
    <ellipse cx="60" cy="300" rx="22" ry="10" fill="#140602" stroke="#78350f" stroke-width="1.5" />
    <line x1="60" y1="305" x2="60" y2="340" stroke="#451a03" stroke-width="3" />
  </g>

  <!-- Cellar Grate / Fireplace in Back Left Corner (Where Cyanide Vial was discarded) -->
  <g transform="translate(60, 360)">
    <rect x="0" y="0" width="60" height="50" rx="4" fill="#0f0707" stroke="#450a0a" stroke-width="1.5" />
    <ellipse cx="30" cy="40" rx="18" ry="8" fill="#ea580c" opacity="0.6" />
    <!-- Iron Grate Bars -->
    <line x1="15" y1="10" x2="15" y2="45" stroke="#1c1917" stroke-width="2" />
    <line x1="30" y1="10" x2="30" y2="45" stroke="#1c1917" stroke-width="2" />
    <line x1="45" y1="10" x2="45" y2="45" stroke="#1c1917" stroke-width="2" />
  </g>

  <!-- Scene Label Overlay -->
  <g transform="translate(40, 460)">
    <rect x="0" y="-12" width="180" height="24" rx="4" fill="#000000" opacity="0.75" />
    <text x="10" y="4" font-family="'Courier Prime', monospace" font-size="11" fill="#c084fc" font-weight="bold">SCENE: THE VELVET CELLAR</text>
  </g>
</svg>

