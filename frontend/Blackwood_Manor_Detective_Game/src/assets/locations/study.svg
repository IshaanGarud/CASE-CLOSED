<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="roomWall" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#140909" />
      <stop offset="60%" stop-color="#241010" />
      <stop offset="100%" stop-color="#120808" />
    </linearGradient>

    <radialGradient id="hearthFlame" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f97316" />
      <stop offset="70%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#1c0707" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="deskLamp" cx="45%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#a7f3d0" stop-opacity="0.9" />
      <stop offset="30%" stop-color="#10b981" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Wall & Wainscoting -->
  <rect width="800" height="500" fill="url(#roomWall)" />
  <!-- Wainscoting Paneling -->
  <g stroke="#3a1c1c" stroke-width="2" fill="#180b0b">
    <rect x="20" y="220" width="100" height="200" />
    <rect x="140" y="220" width="100" height="200" />
    <rect x="560" y="220" width="100" height="200" />
    <rect x="680" y="220" width="100" height="200" />
  </g>

  <!-- Bookshelves Background -->
  <rect x="40" y="40" width="200" height="160" fill="#0f0707" stroke="#2a1212" stroke-width="2" />
  <g fill="#451a1a">
    <rect x="50" y="55" width="180" height="6" />
    <rect x="50" y="105" width="180" height="6" />
    <rect x="50" y="155" width="180" height="6" />
  </g>
  <!-- Books rows -->
  <g fill="#7f1d1d">
    <rect x="55" y="65" width="12" height="38" />
    <rect x="70" y="68" width="16" height="35" fill="#991b1b" />
    <rect x="90" y="62" width="14" height="41" fill="#78350f" />
    <rect x="108" y="65" width="18" height="38" fill="#1e3a8a" />
    <rect x="130" y="70" width="15" height="33" fill="#14532d" />
  </g>

  <!-- Fireplace Hearth Center -->
  <rect x="320" y="200" width="160" height="220" fill="#100707" stroke="#3d1e1e" stroke-width="4" />
  <path d="M 340,300 Q 400,240 460,300 L 460,420 L 340,420 Z" fill="#080303" />
  <!-- Hearth Fire -->
  <ellipse cx="400" cy="380" rx="45" ry="35" fill="url(#hearthFlame)" filter="url(#softGlow)" />
  <path d="M 375,410 Q 390,340 400,310 Q 410,350 425,410 Z" fill="#ffedd5" />
  <path d="M 360,415 Q 380,360 395,335 Q 405,370 415,415 Z" fill="#fb923c" />

  <!-- The Grandfather Clock (Stopped at 11:42 PM) -->
  <g transform="translate(620, 80)">
    <!-- Base & Body -->
    <rect x="0" y="30" width="70" height="350" fill="#1a0c0c" stroke="#451a1a" stroke-width="2" />
    <!-- Clock Hood Arch -->
    <path d="M -5,30 Q 35,-5 75,30 Z" fill="#2d1313" stroke="#5c2424" stroke-width="2" />
    <circle cx="35" cy="5" r="4" fill="#d4af37" />
    <!-- Clock Face -->
    <circle cx="35" cy="75" r="26" fill="#fef3c7" stroke="#b45309" stroke-width="2" />
    <!-- Clock Numerals & Hands at 11:42 -->
    <line x1="35" y1="75" x2="30" y2="58" stroke="#1c1917" stroke-width="2.5" stroke-linecap="round" />
    <line x1="35" y1="75" x2="16" y2="70" stroke="#1c1917" stroke-width="1.8" stroke-linecap="round" />
    <circle cx="35" cy="75" r="2" fill="#b45309" />
    <!-- Pendulum Window -->
    <rect x="15" y="125" width="40" height="140" rx="6" fill="#080303" stroke="#2d1313" stroke-width="1.5" />
    <line x1="35" y1="130" x2="35" y2="210" stroke="#d4af37" stroke-width="2" />
    <circle cx="35" cy="215" r="12" fill="#d4af37" stroke="#fef08a" stroke-width="1" />
  </g>

  <!-- Heavy Mahogany Desk (Foreground Crime Scene) -->
  <g transform="translate(180, 270)">
    <!-- Desk Top Surface -->
    <polygon points="40,90 400,90 450,160 -10,160" fill="#241010" stroke="#451a1a" stroke-width="2" />
    <!-- Desk Legs / Pedestals -->
    <rect x="20" y="160" width="80" height="90" fill="#180b0b" stroke="#3b1717" stroke-width="2" />
    <rect x="340" y="160" width="80" height="90" fill="#180b0b" stroke="#3b1717" stroke-width="2" />
    <!-- Leather Blotter -->
    <polygon points="120,105 320,105 340,145 100,145" fill="#0f172a" stroke="#d4af37" stroke-width="1" />
    <!-- Banker's Brass & Green Glass Lamp -->
    <g transform="translate(60, 40)">
      <path d="M 0,55 L 20,55 L 14,20 L 6,20 Z" fill="#d4af37" />
      <rect x="-10" y="10" width="40" height="14" rx="7" fill="#059669" stroke="#d4af37" stroke-width="1" />
      <!-- Green Light Cone -->
      <polygon points="10,24 -40,110 60,110" fill="url(#deskLamp)" />
    </g>
    <!-- Poisoned Glass & Tipped Decanter -->
    <g transform="translate(260, 110)">
      <ellipse cx="0" cy="10" rx="7" ry="10" fill="#94a3b8" opacity="0.8" stroke="#cbd5e1" stroke-width="0.8" />
      <ellipse cx="0" cy="14" rx="5" ry="4" fill="#d97706" />
      <!-- Fatal almond vapour -->
      <path d="M 0,5 Q 4,-4 2,-12" stroke="#fef08a" stroke-width="0.8" fill="none" opacity="0.6" />
    </g>
    <!-- Quill & Disinheritance Papers -->
    <rect x="140" y="112" width="35" height="24" fill="#f8fafc" opacity="0.85" rx="1" transform="rotate(-6 140 112)" />
    <line x1="165" y1="105" x2="190" y2="85" stroke="#e2e8f0" stroke-width="1.5" stroke-linecap="round" />
  </g>

  <!-- Persian Rug on Floor -->
  <ellipse cx="400" cy="460" rx="260" ry="35" fill="#450a0a" stroke="#991b1b" stroke-width="2" opacity="0.7" />
  <ellipse cx="400" cy="460" rx="230" ry="25" fill="#78350f" stroke="#d4af37" stroke-width="1" opacity="0.5" stroke-dasharray="6 4" />

  <!-- Dramatic Crime Scene Label Overlay -->
  <g transform="translate(40, 460)">
    <rect x="0" y="-12" width="160" height="24" rx="4" fill="#000000" opacity="0.75" />
    <text x="10" y="4" font-family="'Courier Prime', monospace" font-size="11" fill="#f59e0b" font-weight="bold">SCENE: THE PRIVATE STUDY</text>
  </g>
</svg>

