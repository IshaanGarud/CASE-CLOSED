<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stormNight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050a14" />
      <stop offset="40%" stop-color="#0a1526" />
      <stop offset="80%" stop-color="#061a24" />
      <stop offset="100%" stop-color="#030910" />
    </linearGradient>

    <radialGradient id="lightningGlow" cx="65%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#050a14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Night Storm Background -->
  <rect width="800" height="500" fill="url(#stormNight)" />
  <rect width="800" height="500" fill="url(#lightningGlow)" />

  <!-- Iron Glasshouse Framework / Arched Rafters -->
  <g stroke="#1e293b" stroke-width="3" fill="none">
    <!-- Ceiling Arches -->
    <path d="M 0,280 Q 400,-40 800,280" />
    <path d="M 80,300 Q 400,20 720,300" />
    <path d="M 160,320 Q 400,80 640,320" />
    <!-- Vertical Pillars -->
    <line x1="200" y1="180" x2="200" y2="450" />
    <line x1="400" y1="120" x2="400" y2="450" />
    <line x1="600" y1="180" x2="600" y2="450" />
    <!-- Diagonal Braces -->
    <line x1="200" y1="260" x2="400" y2="180" stroke-width="1.5" />
    <line x1="400" y1="180" x2="600" y2="260" stroke-width="1.5" />
  </g>

  <!-- Rain Stream Streaks on Glass Panes -->
  <g stroke="#38bdf8" stroke-width="0.75" opacity="0.35">
    <line x1="220" y1="40" x2="190" y2="150" />
    <line x1="340" y1="20" x2="310" y2="130" />
    <line x1="470" y1="30" x2="440" y2="160" />
    <line x1="590" y1="50" x2="560" y2="180" />
    <line x1="710" y1="40" x2="680" y2="170" />
    <line x1="150" y1="160" x2="120" y2="300" />
    <line x1="280" y1="180" x2="250" y2="310" />
    <line x1="410" y1="160" x2="380" y2="290" />
    <line x1="530" y1="190" x2="500" y2="330" />
  </g>

  <!-- Giant Exotic Palms & Monstera Silhouettes -->
  <!-- Left Palm Tree -->
  <g fill="#062e24" opacity="0.95">
    <path d="M 60,450 Q 80,340 100,280 Q 20,290 -20,330 Q 50,300 80,350 Z" />
    <path d="M 100,280 Q 140,240 210,250 Q 150,270 120,310 Z" />
    <path d="M 100,280 Q 90,190 60,150 Q 75,200 90,260 Z" />
    <path d="M 100,280 Q 120,180 170,160 Q 130,200 110,260 Z" />
    <!-- Monstera Leaves Left -->
    <path d="M 40,430 C 20,380 70,360 110,390 C 80,410 60,430 40,430 Z" fill="#044738" />
  </g>

  <!-- Right Lush Foliage -->
  <g fill="#062e24" opacity="0.95">
    <path d="M 720,460 Q 690,330 650,270 Q 730,280 780,310 Q 710,290 680,340 Z" />
    <path d="M 650,270 Q 600,220 530,240 Q 590,260 630,300 Z" />
    <path d="M 650,270 Q 660,180 700,140 Q 680,190 660,250 Z" />
    <path d="M 650,270 Q 620,170 570,150 Q 610,190 640,250 Z" />
  </g>

  <!-- Central French Doors (The Infiltration Crime Scene) -->
  <g transform="translate(320, 180)">
    <!-- Door Frame -->
    <rect x="0" y="0" width="160" height="280" fill="#09131d" stroke="#1e293b" stroke-width="3" />
    <!-- Left Glass Door -->
    <rect x="10" y="10" width="65" height="260" fill="#0d1b2a" stroke="#334155" stroke-width="1.5" />
    <!-- Right Glass Door (Forced & Cracked) -->
    <rect x="85" y="10" width="65" height="260" fill="#0d1b2a" stroke="#334155" stroke-width="1.5" />

    <!-- Shattered Glass Pane (Where Arthur cut his palm and dropped cufflink) -->
    <polygon points="90,120 140,110 135,170 100,180" fill="#060c14" />
    <!-- Glass Fracture Radiations -->
    <path d="M 115,145 L 85,120 M 115,145 L 145,130 M 115,145 L 105,175 M 115,145 L 135,170" stroke="#7dd3fc" stroke-width="1.5" />
    <!-- Blood Droplet Stain on Frame -->
    <circle cx="140" cy="148" r="3.5" fill="#991b1b" />
    <path d="M 140,150 Q 141,165 140,170" stroke="#7f1d1d" stroke-width="1.5" fill="none" />
  </g>

  <!-- Muddy Footprints on Terrace Floor -->
  <g transform="translate(350, 420)">
    <!-- Muddy Wingtip Left Shoe Impression -->
    <ellipse cx="-20" cy="15" rx="8" ry="16" fill="#1c1917" stroke="#44403c" stroke-width="1" transform="rotate(10 -20 15)" />
    <!-- Muddy Wingtip Right Shoe Impression -->
    <ellipse cx="20" cy="40" rx="8" ry="16" fill="#1c1917" stroke="#44403c" stroke-width="1" transform="rotate(-15 20 40)" />
  </g>

  <!-- Potted Stone Urn in Foreground -->
  <path d="M 220,440 L 250,440 L 245,490 L 225,490 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
  <circle cx="235" cy="430" r="18" fill="#047857" />

  <!-- Scene Label Overlay -->
  <g transform="translate(40, 460)">
    <rect x="0" y="-12" width="220" height="24" rx="4" fill="#000000" opacity="0.75" />
    <text x="10" y="4" font-family="'Courier Prime', monospace" font-size="11" fill="#34d399" font-weight="bold">SCENE: THE CONSERVATORY</text>
  </g>
</svg>

